version: 1

meta:
  name: ensemble-production-readiness
  description: >
    Complete Ensemble's remaining specification work through dependency-ordered,
    independently judged implementation milestones.
  created: 2026-08-01

goal:
  statement: >
    Bring Ensemble from its current usable Vikunja and Codex CLI service to the
    production-ready state required by SPEC.md: portable runtime tools and
    operational events, Codex App Server support, resumable blocked work,
    credential-safe Vikunja-native tools, complete workspace lifecycle and
    containment, immutable operational snapshots and read-only endpoints,
    accurate operator documentation and backlog state, deployable release
    artifacts, and conformance evidence. Implement and commit coherent
    dependency-ordered milestones without weakening provider/runtime boundaries,
    durable provider truth, secret isolation, or cross-platform behavior.
  context_sources:
    - file: ../SPEC.md
    - file: ../AGENTS.md
    - file: ../README.md
    - file: ../package.json
    - file: ../.ensemble/config.yaml
    - cmd: ["rg", "--files", "../src", "../tests", "../docs", "../examples"]
      timeout_sec: 60
    - cmd: ["git", "status", "--short"]
      timeout_sec: 30
  definition_of_done: >
    Every in-scope MUST requirement in SPEC.md has implementation and focused
    deterministic test evidence; Codex CLI remains an optional fallback while
    App Server supports continuation, tools, approvals, input, usage, and rate
    events; blocked work round-trips durably through ProviderAdapter; Vikunja
    tools execute on the host without credential egress; workspace hooks,
    restore verification, refresh, containment, and cleanup are bounded and
    safe; immutable snapshots and configured read-only health/status endpoints
    expose no secrets; npm test, npm run check, npm run build, npm pack --dry-run,
    git diff --check, artifact credential scans, and the v0.3 conformance suite
    pass; Linux and macOS service artifacts are verified, with any real-host or
    publication step that cannot be performed locally documented as an external
    acceptance item; each milestone is independently judged and committed.
  verification:
    - id: tests
      type: programmatic
      check: ["npm", "--prefix", "..", "test"]
      expect: exit_zero
      timeout_sec: 1200
    - id: types
      type: programmatic
      check: ["npm", "--prefix", "..", "run", "check"]
      expect: exit_zero
      timeout_sec: 600
    - id: build
      type: programmatic
      check: ["npm", "--prefix", "..", "run", "build"]
      expect: exit_zero
      timeout_sec: 600
    - id: diff-integrity
      type: programmatic
      check: ["git", "-C", "..", "diff", "--check"]
      expect: exit_zero
      timeout_sec: 60
    - id: milestone-traceability
      type: judge
      rubric: >
        Review the current milestone plan or delivery against SPEC.md and the
        production-readiness goal. Every claim must cite observable source or
        deterministic test evidence. Blocking issues include missing required
        behavior, incomplete failure/restart/cancellation coverage, stale public
        contracts or documentation, unbounded waits, and unsupported compliance
        claims. External-only release or second-platform operations may remain
        only when clearly documented with reproducible acceptance steps.
    - id: architecture-and-security
      type: judge
      rubric: >
        Provider-specific behavior and credentials remain behind
        ProviderAdapter and host tool handlers; runtime-specific protocol stays
        behind Runtime; orchestration policy remains in Scheduler; workspace
        ownership remains in ExecutionEngine; durable state remains provider
        owned. Runtime processes, prompts, workspaces, logs, snapshots, build
        artifacts, and review artifacts must not contain provider credentials.
        Any cross-layer leakage, unsafe path handling, shell command construction,
        or hidden durable controller state is blocking.
    - id: test-quality
      type: judge
      rubric: >
        Each changed behavior has focused deterministic tests for success and
        meaningful malformed, timeout, cancellation, retry, restart, or cleanup
        behavior as applicable. Tests must assert externally meaningful
        contracts and must not require network access, a real provider, or real
        Codex credentials.

host:
  cli: codex
  model: gpt-5.6-sol
  invoke: ["codex", "exec", "--ignore-user-config", "--sandbox", "workspace-write", "--add-dir", ".."]
  timeout_sec: 1800

council:
  - id: independent-judge
    role: judge
    cli: codex-subagent
    model: gpt-5.6-sol
    invoke: ["codex", "exec", "--ignore-user-config", "--sandbox", "read-only", "--add-dir", ".."]
    timeout_sec: 1200
    scope: [plan, delivery]
    local: false

gates:
  plan_gate:
    when: after_plan
    members: [independent-judge]
    verdict_policy: revise_until_clean
    verdict_source: independent-judge
    criteria: [milestone-traceability, architecture-and-security]
    max_revisions: 3
  delivery_gate:
    when: after_each_delivery
    members: [independent-judge]
    verdict_policy: revise_until_clean
    verdict_source: independent-judge
    criteria: [tests, types, build, diff-integrity, milestone-traceability, architecture-and-security, test-quality]
    max_revisions: 3

loop_control:
  max_iterations: 16
  budget:
    tokens: 2000000
    wall_clock_min: 480
  no_progress:
    max_stalled_iterations: 2
    signals:
      - the same blocking issue repeats without new evidence
      - a delivery revision contains no material source or test change
      - deterministic verifier output is unchanged after a claimed fix
    action: human_checkpoint
  human_checkpoints:
    - the same blocker repeats twice
    - a required decision would expand scope beyond SPEC.md or this goal
    - a step requires publishing, pushing, deployment, destructive cleanup, or provider writes
    - a reviewer needs a redacted secret-bearing path
  stop_conditions:
    - every milestone delivery gate and the final conformance gate pass
    - max_iterations or a gate revision cap is reached
    - the no-progress threshold is reached pending user direction
    - the wall-clock or advisory token budget is reached
    - the user requests a stop

execution:
  mode: in_session
  isolation: current_workspace
  side_effects:
    allowed_writes:
      - ../src/**
      - ../tests/**
      - ../docs/**
      - ../examples/**
      - ../README.md
      - ../SPEC.md
      - ../package.json
      - ../package-lock.json
      - ../tsconfig*.json
      - ../.ensemble/**
      - ./production-loop-workspace/**
    excluded_work:
      - Docker workers
      - Windows Service integration
      - mutable dashboard UI
      - automatic source-control delivery
      - publishing to registries or creating hosted releases without separate approval
    requires_approval: false
    duplicate_action_check: true
    commits: explicitly_authorized
    pushes_prs_deployments: forbidden_without_explicit_user_approval

observability:
  state_file: state.json
  run_log: run-log.md
  checkpoint_granularity: gate

privacy:
  egress:
    - to: independent-judge
      sends: ["SPEC and public documentation", "milestone plans", "source and tests", "delivery reports", "verification output"]
      redact: [".env", ".env.*", ".npmrc", ".codex/**", ".git/**", "node_modules/**", "dist/**", "*.tgz", "secrets/**", "**/*.key", "**/*.pem", "**/*.p12"]
      consent: granted-for-codex-review

workspace:
  dir: ./production-loop-workspace
  layout:
    - assessment.md
    - plan.md
    - milestone-{n}.md
    - review-{n}.md
    - compliance-report.md
    - state.json
    - run-log.md
