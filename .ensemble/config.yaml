runtime:
  name: codex
  config:
    operatorRequests: reject
    approvalPolicy: never
    sandbox: workspace-write
    networkAccess: false
    maxTurns: 3
initialRole: planner
terminalOutcomes: [approved, completed]
statuses:
  runnable: [ready, running]
  running: running
  completed: completed
  failed: failed
  blocked: blocked
